<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>China Tech Tracker</title>
<style>
  :root{
    --paper:#f5f7f9; --card:#fff; --ink:#141c24; --mid:#3e4c58; --soft:#64727e;
    --rule:#d9e0e7; --soft-rule:#e7ecf1; --accent:#b93724; --accent-wash:#f6e4e0;
    --jade:#1b6a57; --jade-wash:#dfede9; --slate:#3f5d78; --slate-wash:#e3ebf3;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0d1319; --card:#141c24; --ink:#e2e9ef; --mid:#b3c0cb; --soft:#8a9aa7;
    --rule:#26313c; --soft-rule:#1e2831; --accent:#e8705c; --accent-wash:#3a2119;
    --jade:#56b69a; --jade-wash:#16302a; --slate:#8fb2d1; --slate-wash:#1c2936;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,
        BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",Helvetica,Arial,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px 80px}
  header{padding:36px 0 18px;border-bottom:2px solid var(--ink)}
  h1{margin:0 0 6px;font-size:26px;letter-spacing:-.01em;font-weight:700}
  h1 span{color:var(--soft);font-weight:400;font-size:16px;margin-left:8px}
  .meta{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--soft)}

  .controls{position:sticky;top:0;z-index:5;background:var(--paper);
            padding:14px 0 12px;border-bottom:1px solid var(--rule);margin-bottom:6px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .row+.row{margin-top:9px}
  .lbl{font:10.5px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.12em;
       text-transform:uppercase;color:var(--soft);margin-right:3px;min-width:62px}
  input[type=search],select{font:13px/1.4 inherit;padding:7px 10px;color:var(--ink);
       background:var(--card);border:1px solid var(--rule);border-radius:4px}
  input[type=search]{flex:1;min-width:220px}
  .chip{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;padding:6px 11px;
        border:1px solid var(--rule);background:var(--card);color:var(--mid);
        border-radius:4px;cursor:pointer}
  .chip:hover{border-color:var(--soft);color:var(--ink)}
  .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .chip.ty[aria-pressed=true]{background:var(--slate);border-color:var(--slate);color:#fff}
  .count{font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--soft);margin-left:auto}

  article{padding:18px 0;border-bottom:1px solid var(--soft-rule)}
  article h2{margin:0 0 4px;font-size:17px;line-height:1.35;font-weight:600}
  article h2 a{color:inherit;text-decoration:none}
  article h2 a:hover{color:var(--accent);text-decoration:underline}
  .cn{margin:0 0 6px;font-size:13.5px;color:var(--soft)}
  .byline{margin:0 0 8px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  .byline b{color:var(--accent);font-weight:600}
  .byline .t0{color:var(--jade)}
  .byline span{color:var(--soft)}
  .tags{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px;
        font:11px/1.4 ui-monospace,Menlo,monospace;color:var(--soft)}
  .t{padding:2px 7px;border-radius:3px;background:var(--jade-wash);color:var(--jade)}
  .t.ty{background:var(--slate-wash);color:var(--slate)}
  .t.src{background:var(--accent-wash);color:var(--accent)}
  .sum{margin:0;color:var(--mid);max-width:78ch}
  .empty{padding:60px 0;text-align:center;color:var(--soft)}
  .stale{display:none;margin:14px 0 0;padding:11px 14px;border-left:3px solid var(--accent);
         background:var(--accent-wash);color:var(--accent);font-size:13.5px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>China Tech Tracker <span>Daily Technology &amp; Policy Intelligence</span></h1>
  <div class="meta">Last updated: {{UPDATED}} · Automated daily collection</div>
  <div class="stale" id="stale"></div>
</header>

<div class="controls">
  <div class="row">
    <input type="search" id="q" placeholder="Search titles, summaries, companies…">
    <select id="company"><option value="">All companies</option></select>
    <select id="source"><option value="">All sources</option></select>
    <select id="days">
      <option value="7">Past 7 days</option>
      <option value="30" selected>Past 30 days</option>
      <option value="90">Past 90 days</option>
      <option value="9999">All time</option>
    </select>
  </div>
  <div class="row"><span class="lbl">Sector</span><span id="sectors"></span></div>
  <div class="row"><span class="lbl">Type</span><span id="types"></span><span class="count" id="count"></span></div>
</div>

<div id="list"></div>

<script>
const ITEMS = /*DATA*/[];
const UPDATED = "{{UPDATED_ISO}}";

const SECTORS = ["AI","Robotics","Semiconductors","Quantum",
                 "Digital Connectivity","Biotech","Green Tech","Space"];
const TYPES = ["Breakthrough","Product","Corporate","Capital","Policy","Geopolitics"];
const TYPE_CN = {Breakthrough:"新技术", Product:"新产品", Corporate:"公司动态",
                 Capital:"资本运作", Policy:"监管政策", Geopolitics:"国际关系"};

let sector = "", ntype = "";

const $ = s => document.querySelector(s);
const list=$("#list"), qEl=$("#q"), coEl=$("#company"), srEl=$("#source"), dyEl=$("#days");

// 停更自检
(function(){
  const age = (Date.now() - new Date(UPDATED)) / 36e5;
  if (age > 48) {
    const el = $("#stale");
    el.textContent = `⚠ Data has not updated for ${Math.floor(age/24)} days — the ingestion workflow may have stalled. Check GitHub Actions.`;
    el.style.display = "block";
  }
})();

function chips(host, values, labeller, current, onPick, cls){
  const el = $(host);
  el.innerHTML = `<button class="chip ${cls}" data-v="" aria-pressed="${current===""}">All</button>` +
    values.filter(v => ITEMS.some(i => i[cls==="ty"?"news_type":"sector"] === v))
          .map(v => {
            const n = ITEMS.filter(i => i[cls==="ty"?"news_type":"sector"] === v).length;
            return `<button class="chip ${cls}" data-v="${v}" aria-pressed="false">${labeller(v)} <em style="opacity:.55;font-style:normal">${n}</em></button>`;
          }).join("");
  el.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    onPick(b.dataset.v);
    el.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    render();
  });
}
chips("#sectors", SECTORS, v => v, "", v => sector = v, "se");
chips("#types",   TYPES,   v => `${v} ${TYPE_CN[v]||""}`, "", v => ntype = v, "ty");

const fill = (el, vals) => el.insertAdjacentHTML("beforeend",
  [...new Set(vals)].filter(Boolean).sort().map(v=>`<option>${esc(v)}</option>`).join(""));
fill(coEl, ITEMS.flatMap(i => i.companies || []));
fill(srEl, ITEMS.map(i => i.source_cn || i.source_en));   // 真实发布媒体

[qEl, coEl, srEl, dyEl].forEach(el => el.addEventListener("input", render));

function render(){
  const q = qEl.value.trim().toLowerCase(), co = coEl.value, sr = srEl.value;
  const floor = new Date(Date.now() - dyEl.value * 864e5).toISOString().slice(0,10);

  const hits = ITEMS.filter(i =>
    (!sector || i.sector === sector) &&
    (!ntype  || i.news_type === ntype) &&
    (!co || (i.companies || []).includes(co)) &&
    (!sr || i.source_cn === sr || i.source_en === sr) &&
    i.date >= floor &&
    (!q || [i.title_en, i.title_cn, i.summary_en, (i.companies||[]).join(" ")]
             .join(" ").toLowerCase().includes(q))
  );

  $("#count").textContent = `${hits.length} / ${ITEMS.length} items`;
  list.innerHTML = hits.length ? hits.map(i => `
    <article>
      <h2><a href="${i.url}" target="_blank" rel="noopener">${esc(i.title_en)}</a></h2>
      ${i.title_cn ? `<p class="cn">${esc(i.title_cn)}</p>` : ""}
      <div class="byline">
        <b class="${i.source_tier === 0 ? 't0' : ''}">${esc(i.source_cn || i.source_en || "—")}</b>
        ${i.source_en && i.source_en !== i.source_cn ? `<span> ${esc(i.source_en)}</span>` : ""}
        <span> · ${i.date}</span>
      </div>
      <div class="tags">
        <span class="t">${esc(i.sector)}</span>
        ${i.news_type ? `<span class="t ty">${esc(i.news_type)}</span>` : ""}
        ${(i.companies||[]).map(c=>`<span>${esc(c)}</span>`).join(" · ")}
      </div>
      <p class="sum">${esc(i.summary_en)}</p>
    </article>`).join("")
    : `<div class="empty">No matching items</div>`;
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
render();
</script>
</div>
</body>
</html>
