<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>China Tech Tracker</title>
<style>
  :root{
    --paper:#f5f7f9; --card:#fff; --ink:#141c24; --mid:#3e4c58; --soft:#64727e;
    --rule:#d9e0e7; --soft-rule:#e7ecf1; --accent:#b93724; --accent-wash:#f6e4e0;
    --jade:#1b6a57; --jade-wash:#dfede9;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0d1319; --card:#141c24; --ink:#e2e9ef; --mid:#b3c0cb; --soft:#8a9aa7;
    --rule:#26313c; --soft-rule:#1e2831; --accent:#e8705c; --accent-wash:#3a2119;
    --jade:#56b69a; --jade-wash:#16302a;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,
        BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px 80px}
  header{padding:36px 0 18px;border-bottom:2px solid var(--ink)}
  h1{margin:0 0 6px;font-size:26px;letter-spacing:-.01em;font-weight:700}
  h1 span{color:var(--soft);font-weight:400;font-size:16px;margin-left:8px}
  .meta{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--soft)}

  .controls{position:sticky;top:0;z-index:5;background:var(--paper);
            padding:14px 0 12px;border-bottom:1px solid var(--rule);margin-bottom:6px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .row+.row{margin-top:9px}
  input[type=search],select{font:13px/1.4 inherit;padding:7px 10px;color:var(--ink);
       background:var(--card);border:1px solid var(--rule);border-radius:4px}
  input[type=search]{flex:1;min-width:220px}
  .chip{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;padding:6px 11px;
        border:1px solid var(--rule);background:var(--card);color:var(--mid);
        border-radius:4px;cursor:pointer}
  .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .count{font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--soft);margin-left:auto}

  article{padding:18px 0;border-bottom:1px solid var(--soft-rule)}
  article h2{margin:0 0 6px;font-size:17px;line-height:1.35;font-weight:600}
  article h2 a{color:inherit;text-decoration:none}
  article h2 a:hover{color:var(--accent);text-decoration:underline}
  .tags{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px;
        font:11px/1.4 ui-monospace,Menlo,monospace;color:var(--soft)}
  .t{padding:2px 7px;border-radius:3px;background:var(--jade-wash);color:var(--jade)}
  .t.src{background:var(--accent-wash);color:var(--accent)}
  .sum{margin:0;color:var(--mid);max-width:74ch}
  .empty{padding:60px 0;text-align:center;color:var(--soft)}
  .stale{display:none;margin:14px 0 0;padding:11px 14px;border-left:3px solid var(--accent);
         background:var(--accent-wash);color:var(--accent);font-size:13.5px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>China Tech Tracker <span>Daily Policy & Technology Intelligence</span></h1>
  <div class="meta">Last updated: {{UPDATED}} · Automated Daily Collection</div>
  <div class="stale" id="stale"></div>
</header>

<div class="controls">
  <div class="row">
    <input type="search" id="q" placeholder="Search titles, summaries, companies...">
    <select id="company"><option value="">All Companies</option></select>
    <select id="source"><option value="">All Sources</option></select>
    <select id="days">
      <option value="7">Past 7 Days</option>
      <option value="30" selected>Past 30 Days</option>
      <option value="90">Past 90 Days</option>
      <option value="9999">All Time</option>
    </select>
  </div>
  <div class="row" id="sectors"></div>
</div>

<div id="list"></div>

<script>
const ITEMS = /*DATA*/[];
const UPDATED = "{{UPDATED_ISO}}";

// 自检停更警报（全英文）
(function(){
  const age = (Date.now() - new Date(UPDATED)) / 36e5;
  if (age > 48) {
    const el = document.getElementById("stale");
    el.textContent = `⚠ Warning: Data has not been updated for ${Math.floor(age/24)} days. Ingestion workflow may have stalled — please check GitHub Actions.`;
    el.style.display = "block";
  }
})();

// 板块中英文映射字典（避免改动后台数据结构）
const SECTOR_MAP = {
  "人工智能": "AI & Big Data",
  "半导体": "Semiconductors",
  "数字互联": "Digital & Internet",
  "绿色科技": "Green Tech",
  "生物医药": "Biotech & Healthcare",
  "航天": "Aerospace",
  "量子": "Quantum Computing",
  "政策": "Policy & Governance",
  "市场与交易": "Markets & Finance",
  "综合": "General Tech"
};

const SECTORS = ["人工智能","半导体","数字互联","绿色科技","生物医药","航天","量子","政策","市场与交易","综合"];
let sector = "";

const $ = s => document.querySelector(s);
const list = $("#list"), qEl = $("#q"), coEl = $("#company"),
      srEl = $("#source"), dyEl = $("#days"), secEl = $("#sectors");

// 渲染板块筛选按键
secEl.innerHTML = `<button class="chip" data-s="" aria-pressed="true">All Sectors</button>` +
  SECTORS.filter(s => ITEMS.some(i => i.sector === s))
         .map(s => `<button class="chip" data-s="${s}" aria-pressed="false">${SECTOR_MAP[s] || s} <em style="opacity:.6;font-style:normal">${ITEMS.filter(i=>i.sector===s).length}</em></button>`)
         .join("") + `<span class="count" id="count"></span>`;

secEl.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  sector = b.dataset.s;
  secEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  render();
});

// 充实公司与信源下拉菜单
const fill = (el, vals) => el.insertAdjacentHTML("beforeend",
  [...new Set(vals)].filter(Boolean).sort().map(v=>`<option>${esc(v)}</option>`).join(""));
fill(coEl, ITEMS.flatMap(i => i.companies || []));
fill(srEl, ITEMS.map(i => i.source_cn || i.source_en || i.source));

[qEl, coEl, srEl, dyEl].forEach(el => el.addEventListener("input", render));

function render(){
  const q = qEl.value.trim().toLowerCase(), co = coEl.value, sr = srEl.value;
  const floor = new Date(Date.now() - dyEl.value * 864e5).toISOString().slice(0,10);

  const hits = ITEMS.filter(i =>
    (!sector || i.sector === sector) &&
    (!co || (i.companies || []).includes(co)) &&
    (!sr || (i.source_cn === sr || i.source_en === sr || i.source === sr)) &&
    i.date >= floor &&
    (!q || [i.title_en, i.title_cn, i.summary_en, (i.companies||[]).join(" ")]
             .join(" ").toLowerCase().includes(q))
  );

  $("#count").textContent = `${hits.length} / ${ITEMS.length} items`;
  list.innerHTML = hits.length ? hits.map(i => `
    <article>
      <h2><a href="${i.url}" target="_blank" rel="noopener">${esc(i.title_en)}</a></h2>
      <div class="tags">
        <span class="t">${esc(SECTOR_MAP[i.sector] || i.sector)}</span>
        <span class="t src">${esc(i.source_en || i.source_cn || i.source)}</span>
        <span>${i.date}</span>
        ${(i.companies||[]).map(c=>`<span>${esc(c)}</span>`).join(" · ")}
      </div>
      <p class="sum">${esc(i.summary_en)}</p>
    </article>`).join("")
    : `<div class="empty">No matching items found</div>`;
}

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
render();
</script>
</div>
</body>
</html>
