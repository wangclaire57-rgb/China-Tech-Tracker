# ============================================================
#  信源白名单 —— 只有这里列出的域名才会进入管线
#
#  两层防护：
#    1) sources.yml 的查询用 (site:a OR site:b ...) 把检索范围锁死
#    2) build.py 再按 Google News 返回的真实发布媒体域名硬过滤一遍
#       （查询偶尔会漏，这一层是兜底保证）
#
#  tier 用于「同一件事多家报道时保留哪一家」：数字越小优先级越高
#    0 = 政府部委原始发布（政策类最权威）
#    1 = 主流大媒体
#    2 = 行业垂直媒体
# ============================================================

domains:

  # ---------- tier 1：主流媒体 ----------
