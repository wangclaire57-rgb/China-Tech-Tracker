name: Update tracker

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pages: write      # 部署 GitHub Pages 所需权限
  id-token: write   # 身份验证权限

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 防线 1：确认每个文件装的确实是它该装的内容。
      # 曾经发生过 build.py 里被贴成 providers.py 内容的事故 —— 那个文件没有
      # __main__ 入口，跑起来静默退出 0，workflow 全绿但页面永远不更新。
      - name: Verify file integrity
        run: python verify_files.py

      # 核心步骤：调用大模型生成数据
      - name: Build tracker content
        id: build
        continue-on-error: true
        run: python build.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          TRACKER_PROVIDER:  ${{ vars.TRACKER_PROVIDER }}
          TRACKER_MODEL:     ${{ vars.TRACKER_MODEL }}
          TRACKER_CONCURRENCY: ${{ vars.TRACKER_CONCURRENCY }}   # 默认 4，限流就调到 2
          TRACKER_MAX_NEW:     ${{ vars.TRACKER_MAX_NEW }}       # 默认 250，单次加工上限
          SOURCES_CSV_URL:   ${{ vars.SOURCES_CSV_URL }}
          NOTIFY_WEBHOOK_URL:  ${{ secrets.NOTIFY_WEBHOOK_URL }}
          NOTIFY_WEBHOOK_TYPE: ${{ vars.NOTIFY_WEBHOOK_TYPE }}
          NOTIFY_PAGE_URL:     ${{ vars.NOTIFY_PAGE_URL }}

      # 防线 2：退出码 0 不代表真干了活。直接检查产物有没有被重写。
      # 这一步失败会中断后面的 Pages 部署，避免把旧页面当成新的发出去。
      - name: Assert the page was actually rebuilt
        if: steps.build.outcome == 'success'
        run: |
          if [ ! -f docs/index.html ]; then
            echo "::error::docs/index.html 不存在 —— build.py 没有产出页面"
            exit 1
          fi
          AGE=$(( $(date +%s) - $(stat -c %Y docs/index.html) ))
          echo "docs/index.html 距上次写入 ${AGE} 秒"
          if [ "$AGE" -gt 900 ]; then
            echo "::error::页面没有被重新生成（已 ${AGE} 秒未变动）。"
            echo "::error::build.py 很可能退出码为 0 但实际什么都没做 —— 检查它的内容是否正确。"
            exit 1
          fi

      # 1. 提交更新的数据到 Git 仓库
      - name: Commit results to git
        if: always()
        run: |
          git config user.name  "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add -A data docs
          git diff --staged --quiet || git commit -m "update $(date -u +%F) [${{ steps.build.outcome }}]"
          git push

      # 2. 将生成好的 docs 目录直接发布到 GitHub Pages
      - name: Setup Pages
        if: steps.build.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        if: steps.build.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      # 3. 失败时开/更新 Alert Issue
      - name: Open or update alert issue
        if: failure() || steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create tracker-alert --color B93724 --description "追踪器运行异常" 2>/dev/null || true

          SUMMARY="（本次没能写出 health.json，说明 build.py 在更早的阶段就崩了）"
          if [ -f data/health.json ]; then
            SUMMARY=$(jq -r '
              "- 状态：\(.status)\n- 模型：\(.provider)/\(.model)\n" +
              "- 信源：\(.sources.total) 个，其中 \(.sources.empty) 个返回空\n" +
              "- 条目：抓到 \(.items.fetched)，新增 \(.items.new)，成功加工 \(.items.enriched)，失败 \(.items.failed)\n" +
              "\n问题：\n" + (.problems | map("- " + .) | join("\n"))' data/health.json)
          fi

          BODY=$(printf '追踪器在 %s 的运行出现异常。\n\n%s\n\n运行日志：%s/%s/actions/runs/%s\n\n---\n修好之后请手动关闭这个 Issue；下次再出问题会重新开一个。' \
            "$(date -u +'%F %H:%M UTC')" "$SUMMARY" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          NUM=$(gh issue list --state open --label tracker-alert --limit 1 --json number -q '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
            echo "已在 Issue #$NUM 追加评论"
          else
            gh issue create --title "🔴 追踪器运行异常" --label tracker-alert --body "$BODY"
          fi

      - name: Mark job failed
        if: steps.build.outcome == 'failure'
        run: exit 1
