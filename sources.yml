# ============================================================
#  中国科技动态追踪 — 信源配置文件 (Source Registry)
#
#  type: rss    直接读取 RSS/Atom 订阅源（最稳定快捷）
#  type: gnews  通过 Google News 聚合引擎检索（解决无 RSS 及反爬问题）
#  enabled: false 临时停用信源
# ============================================================

defaults:
  max_items_per_run: 25
  lookback_days: 7

sources:

  # ============================================================
  # 1. 综合科技与深度媒体 (Comprehensive & Deep Tech)
  # ============================================================
  - id: scmp_tech
    name_cn: 南华早报·科技
    name_en: SCMP Tech
    type: rss
    url: https://www.scmp.com/rss/36/feed
    lang: en
    default_sector: General Tech

  - id: pandaily
    name_cn: Pandaily
    name_en: Pandaily
    type: rss
    url: https://pandaily.com/feed/
    lang: en
    default_sector: General Tech

  - id: xinhua_tech
    name_cn: 新华网·科技
    name_en: Xinhua Net (Tech)
    type: gnews
    query: "site:news.cn/tech OR (新华网 科技) when:7d"
    lang: zh
    default_sector: General Tech

  - id: caixin_tech
    name_cn: 财新网·科技
    name_en: Caixin Tech
    type: gnews
    query: "site:caixin.com 科技 OR 创投 OR 芯片 when:7d"
    lang: zh
    default_sector: General Tech

  - id: 36kr
    name_cn: 36氪
    name_en: 36Kr
    type: gnews
    query: "site:36kr.com OR (36氪 科技) when:7d"
    lang: zh
    default_sector: General Tech

  - id: stdaily
    name_cn: 中国科技网（科技日报）
    name_en: Science and Technology Daily
    type: gnews
    query: "site:stdaily.com when:7d"
    lang: zh
    default_sector: General Tech

  - id: thepaper_tech
    name_cn: 澎湃新闻·科技
    name_en: The Paper (Tech)
    type: gnews
    query: "site:thepaper.cn 科技 OR 算力 OR 创投 when:7d"
    lang: zh
    default_sector: General Tech

  - id: jingji_21jingji
    name_cn: 21世纪经济报道 & 经济网
    name_en: 21st Century Business Herald & Economic Daily
    type: gnews
    query: "site:21jingji.com OR site:jingji.com.cn 科技 OR 产业 OR 监管 when:7d"
    lang: zh
    default_sector: General Tech

  - id: cinn_industrial
    name_cn: 中国工业新闻网
    name_en: China Industry News
    type: gnews
    query: "site:cinn.cn when:7d"
    lang: zh
    default_sector: General Tech

  # ============================================================
  # 2. 人工智能与前沿计算 (AI & Advanced Computing)
