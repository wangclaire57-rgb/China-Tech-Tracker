  - id: nikkei_china_tech
    name_cn: 恒生/日经亚洲·中国科技
    name_en: Nikkei Asia (China Tech)
    type: gnews
    query: "site:asia.nikkei.com \"China\" \"tech\" when:7d"
    lang: en
    default_sector: General Tech

  - id: reuters_bloomberg_tech
    name_cn: 路透社 & 彭博社·中国科技
    name_en: Reuters & Bloomberg (China Tech)
    type: gnews
    query: "(site:reuters.com OR site:bloomberg.com) \"China\" (\"technology\" OR \"semiconductor\" OR \"AI\") when:7d"
    lang: en
    default_sector: General Tech

  # ============================================================
  # 10. 国家部委与官方政策追踪 (China State & Policy Agencies)
  #     覆盖：国务院、科技部、中科院、工信部、网信办、国家数据局、发改委、
  #     商务部、海关总署、外交部、国防部、财政部、央行、教育部、公安部、
  #     卫健委、药监局、生态环境部、交通部、自然资源部、人社部、住建部
  # ============================================================
  - id: state_policy_core
    name_cn: 核心部委 (发改委/工信部/网信办/科技部/国家数据局/中科院)
    name_en: Policy - Tech & Economic Regulators (NDRC, MIIT, CAC, MOST, NDA, CAS)
    type: gnews
    query: "site:ndrc.gov.cn OR site:miit.gov.cn OR site:cac.gov.cn OR site:most.gov.cn OR site:nda.gov.cn OR site:cas.gov.cn OR site:scio.gov.cn OR \"工业和信息化部\" OR \"国家数据局\" OR \"国家网信办\" when:7d"
    lang: zh
    default_sector: Policy & Governance

  - id: state_policy_trade
    name_cn: 宏观与外贸规制 (商务部/海关总署/外交部/国防部/财政部/央行)
    name_en: Policy - Trade, Diplomacy & Finance (MOFCOM, Customs, MFA, MOD, MOF, PBC)
    type: gnews
    query: "site:mofcom.gov.cn OR site:customs.gov.cn OR site:fmprc.gov.cn OR site:mod.gov.cn OR site:mof.gov.cn OR site:pbc.gov.cn OR \"商务部\" OR \"海关总署\" OR \"出口管制\" OR \"实体清单\" when:7d"
    lang: zh
    default_sector: Policy & Governance

  - id: state_policy_sectors
    name_cn: 行业监管与部委政策 (药监局/卫健委/生态环境部/交通部/自然资源部/教育部/公安部/住建部/人社部)
    name_en: Policy - Sectoral Ministries (NMPA, NHC, MEE, MOT, MNR, MOE, MPS)
    type: gnews
    query: "site:nmpa.gov.cn OR site:nhc.gov.cn OR site:mee.gov.cn OR site:mot.gov.cn OR site:mnr.gov.cn OR site:moe.gov.cn OR site:mps.gov.cn OR site:mohurd.gov.cn OR site:mohrss.gov.cn OR \"国家药监局\" OR \"生态环境部\" OR \"交通运输部\" when:7d"
    lang: zh
    default_sector: Policy & Governance
