  # ============================================================
  # 9. 国际智库与外媒关注 (Global Intelligence & Foreign Media)
  # ============================================================
  - id: eto_scout
    name_cn: 新兴技术观察站
    name_en: Emerging Technology Observatory (ETO)
    type: gnews
    query: "site:eto.tech OR \"Emerging Technology Observatory\" when:7d"
    lang: en
    default_sector: Policy & Governance

  - id: the_wire_china
    name_cn: The Wire China
    name_en: The Wire China
    type: gnews
    query: "site:thewirechina.com when:7d"
    lang: en
