# ============================================================
#  中国科技动态追踪 — 信源配置 v3
#
#  设计原则：主题式查询为主，站点式为辅。
#    site: 查询 = 「这家媒体最近发了什么」，按 Google 对站点的相关性排序，
#                 不按重要性。实测 site:taibo.cn 返回 88 条，前几条是
#                 「会员服务」页和一条人事新闻，真正的航天报道在截断线之后。
#    主题式查询 = 「这件事谁报道了」，头部就是重要新闻。
#
#  每个板块都配了三类查询，对应你要的三种信息：
#    tech    新技术 / 新产品 / 技术突破
#    corp    公司动态：融资、上市、并购、重组、战略调整、人事
#    policy  监管政策、行业组织、政府合作、国际冲突与合作
#
#  default_sector 必须是 providers.py 里 SECTORS 的值。
# ============================================================

defaults:
  max_items_per_run: 30
  lookback_days: 14

sources:

  # ══════════════════ AI ══════════════════
  - id: ai_tech
    name_cn: 中国大模型·技术
    name_en: China AI · Tech
    type: gnews
    query: "中国 大模型 OR 人工智能 发布 OR 开源 OR 突破 when:14d"
    lang: zh
    default_sector: AI
    max_items_per_run: 40

  - id: ai_corp
    name_cn: 中国AI·公司动态
    name_en: China AI · Corporate
    type: gnews
    query: "中国 AI OR 人工智能 公司 融资 OR 上市 OR 收购 OR 战略 when:14d"
    lang: zh
    default_sector: AI

  - id: ai_policy
    name_cn: 中国AI·监管
    name_en: China AI · Policy
    type: gnews
    query: "人工智能 监管 OR 政策 OR 标准 OR 备案 中国 when:14d"
    lang: zh
    default_sector: AI

  - id: qbitai
    name_cn: 量子位
    name_en: QbitAI
    type: gnews
    query: "量子位 模型 OR 智能体 when:14d"
    lang: zh
    default_sector: AI

  - id: jiqizhixin
    name_cn: 机器之心
    name_en: Synced
    type: gnews
    query: "机器之心 模型 OR 论文 when:14d"
    lang: zh
    default_sector: AI

  # ══════════════════ Robotics ══════════════════
  - id: robot_tech
    name_cn: 具身智能·技术
    name_en: Robotics · Tech
    type: gnews
    query: "中国 人形机器人 OR 具身智能 发布 OR 量产 OR 落地 when:14d"
    lang: zh
    default_sector: Robotics
    max_items_per_run: 40

  - id: robot_corp
    name_cn: 机器人·公司动态
    name_en: Robotics · Corporate
    type: gnews
    query: "机器人 公司 融资 OR 上市 OR 订单 OR 工厂 中国 when:14d"
    lang: zh
    default_sector: Robotics

  # ══════════════════ Semiconductors ══════════════════
  - id: semi_tech
    name_cn: 中国半导体·技术
