# ============================================================
#  信源配置 v4 —— 只从 whitelist.yml 的域名抓取
#
#  三种 type，对应三种媒体特性（实测得出，不是拍脑袋）：
#
#  1) type: rss    原生订阅源。最干净，有就优先用。
#
#  2) type: topic  主题式检索 + 按发布媒体域名硬过滤。
#     用于综合媒体（新华网/财新/澎湃/21世纪/部委）—— 它们什么都发，
#     必须靠主题词筛。实测：不加 site: 的主题查询 95% 切题，加了
#     site: 之后 Google 会忽略主题词（切题率掉到 0%），所以这里
#     不写 site:，改为抓回来之后按 entry.source 的域名硬过滤。
#     抓取免费，被过滤掉的条目不花一分钱。
#
#  3) type: site   裸 site: 检索。用于垂直媒体（爱集微/泰伯网/C114…）——
#     它们发的东西本来就全是本行业的，不需要再加主题词。
#
#  default_sector 只是兜底，模型会重新判定。
# ============================================================

defaults:
  max_items_per_run: 40      # 抓取免费，可以放宽；真正花钱的是过滤后送加工的条数
  lookback_days: 14
  window: "when:14d"

sources:

  # ════════ type: topic —— 综合媒体与部委，靠主题词筛 ════════
