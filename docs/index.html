hat Pay team, the app allows international travelers to make payments at tens of millions of shops and attractions across the WeChat Pay network by linking foreign credit cards or digital wallets.", "companies": ["Tencent", "WeChat Pay"]}, {"id": "d18679db6ed0a200", "url": "https://pandaily.com/iflytek-spark-asr-2-0-noise-dialect-code-switch", "title_cn": "", "date": "2026-09-24", "source_cn": "Pandaily", "source_en": "Pandaily", "sector": "人工智能", "title_en": "iFLYTEK Releases Spark-ASR-2.0 for Noise, Dialect, and Code-Switch Recognition", "summary_en": "iFLYTEK has released its new automatic speech recognition model, Spark-ASR-2.0. This update is designed to handle challenging audio environments, including noise, various dialects, and Chinese-English code-switching scenarios. The company plans to integrate the technology into iFLYTEK Input and offer it via an open API. According to iFLYTEK, the inference cost of Spark-ASR-2.0 is approximately 10 percent higher than that of the previous version, 1.0.", "companies": ["iFLYTEK"]}, {"id": "e2d9d2f64f13d899", "url": "https://pandaily.com/xfeon-physical-ai-matrix-xinghe-s1-aglobe-xinghui-token", "title_cn": "XFEON发布物理AI矩阵：星和S1边缘芯片、AGlobe具身大脑及星辉Token工作站", "date": "2026-09-24", "source_cn": "Pandaily", "source_en": "Pandaily", "sector": "人工智能", "title_en": "XFEON Unveils Physical-AI Matrix: Xinghe S1 Chip, AGLobe Brain, Xinghui Workstations", "summary_en": "On September 22, XFEON launched a physical-AI matrix. The system is led by the Xinghe S1 edge chip, which delivers approximately 105 TOPS in INT8 performance at around 25W power consumption. The matrix also includes the AGLobe embodied brain and Xinghui Token workstations, according to coverage citing xfeon.com.", "companies": ["XFEON"]}, {"id": "ecdfd7864b2626e8", "url": "https://pandaily.com/moore-threads-mtt-s5000-embodied-rl-curves-rlinf-92-percent", "title_cn": "", "date": "2026-09-24", "source_cn": "Pandaily", "source_en": "Pandaily", "sector": "人工智能", "title_en": "Moore Threads MTT S5000 Embodied RL Curves Match Mainstream GPUs (r=0.976); Dual-Arm ~92%", "summary_en": "Moore Threads reports that its MTT S5000 GPU demonstrates embodied reinforcement learning training curves comparable to mainstream GPUs, achieving a Pearson correlation coefficient of r=0.976. Additionally, the company states that dual-arm real-robot assembly achieved a success rate of approximately 92 percent using RLinf CI integration.", "companies": ["Moore Threads"]}, {"id": "93409c27a0a40d5b", "url": "https://pandaily.com/huawei-atlas-960e-superpod-npo-hi-one-4096-npus-8-eflops", "title_cn": "华为Atlas 960E超级pod：首个NPO/Hi-ONE光节点，4096个NPU，8 EFLOPS FP8", "date": "2026-09-24", "source_cn": "Pandaily", "source_en": "Pandaily", "sector": "人工智能", "title_en": "Huawei Atlas 960E SuperPoD: First NPO/Hi-ONE Optical Node, 4096 NPUs, 8 EFLOPS FP8", "summary_en": "Huawei unveiled the Atlas 960E SuperPoD, featuring its first NPO (Network Processing Optics) and Hi-ONE optical node. The system integrates up to 4,096 NPUs to deliver 8 EFLOPS of FP8 compute performance. Huawei claims this architecture reduces power consumption by over 550 kW compared to solutions requiring approximately 48,000 800G optical modules.", "companies": ["Huawei"]}, {"id": "232aca2ee2e1c882", "url": "https://pandaily.com/deepseek-dsec-elastic-compute-agentic-training-sandbox-3m-day", "title_cn": "", "date": "2026-09-24", "source_cn": "Pandaily", "source_en": "Pandaily", "sector": "人工智能", "title_en": "DeepSeek Details DSec Elastic Compute Platform for Agentic Training", "summary_en": "DeepSeek published arXiv paper 2609.22978 detailing its DSec elastic compute platform, which provides sandboxes for agentic reinforcement learning training. The system reportedly handles approximately 3 million sandbox creations per day, with peak concurrency exceeding 380,000 and creation rates surpassing 5,000 per second. Wenfeng Liang is a co-author on the work.", "companies": ["DeepSeek"]}, {"id": "ffcc9a28912b321e", "url": "https://pandaily.com/sensetime-sensenova-u1-pro-image-model-8k-raccoon-api", "title_cn": "商汤发布SenseNova U1 Pro图像模型，支持最高8K输出", "date": "2026-09-24", "source_cn": "Pandaily", "source_en": "Pandaily", "sector": "人工智能", "title_en": "SenseTime Ships SenseNova U1 Pro Image Model With Up to 8K Output via Raccoon and API", "summary_en": "SenseTime has released its production SenseNova U1 Pro image-creation model. The release includes the Raccoon app and SenseNova API, supporting output resolutions up to 8K with custom aspect ratios. The technology utilizes interleaved text-image chain-of-thought generation.", "companies": ["SenseTime"]}, {"id": "7925e3a32eab6f9e", "url": "https://pandaily.com/alibaba-cloud-qwen-book-ai-agent-pc-skill-keyboard-omarchy", "title_cn": "阿里云发布通义千问Book AI代理PC：技能键盘、AI岛显示及Omarchy操作系统合作", "date": "2026-09-24", "source_cn": "Pandaily", "source_en": "Pandaily", "sector": "综合", "title_en": "Alibaba Cloud Unveils Qwen Book AI Agent PC with Skill Keyboard and Omarchy OS", "summary_en": "Alibaba Cloud launched the Qwen Book, its first AI agent personal computer, at Apsara 2026. The device features a distinctive Skill keyboard array, an AI Island status display, and collaboration with the open-source Omarchy desktop OS. Alibaba Cloud has opened a Day One tester program, with trial operations scheduled for December.", "companies": ["Alibaba Cloud", "Omarchy"]}, {"id": "e284c8b78bec145e", "url": "https://pandaily.com/alibaba-qwen-intelligence-phone-agent-stack-honor-magic9", "title_cn": "", "date": "2026-09-24", "source_cn": "Pandaily", "source_en": "Pandaily", "sector": "人工智能", "title_en": "Alibaba Launches Qwen Intelligence Phone-Agent Stack; Honor Magic9 Named First Formal Adopter", "summary_en": "At Apsara 2026, Alibaba released Qwen Intelligence, a modular phone-agent platform featuring Mobile Planner, Mobile-Use, and Creative agents along with an OS Harness. Honor's upcoming Magic9 series has been designated as the first formal adopter of this technology.", "companies": ["Alibaba", "Honor"]}, {"id": "d7efeb1ae63bfc3e", "url": "https://pandaily.com/xiaomi-hysparse2-mimo-v3-two-level-kv-sharing-prefill", "title_cn": "", "date": "2026-09-24", "source_cn": "Pandaily", "source_en": "Pandaily", "sector": "人工智能", "title_en": "Xiaomi Details HySparse2 for MiMo-V3: Two-Level KV Sharing Reduces Prefill FLOPs by 5x", "summary_en": "Xiaomi's LLM-Core team published the HySparse2 hybrid sparse-attention design, targeting MiMo-V3-class agentic models. The architecture utilizes two-level key-value (KV) sharing to optimize performance. On an 80B-A3B Mixture of Experts (MoE) model, this approach reduces prefill FLOPs for a 1M-token sequence by approximately 5× compared to Hybrid Sparse Window Attention (SWA).", "companies": ["Xiaomi"]}, {"id": "2a5c712a8ab0bebf", "url": "https://pandaily.com/huawei-oceanstor-m900-context-memory-storage-kv-cache-60us", "title_cn": "华为发布OceanStor M900语境内存存储：PB级共享KV缓存与60微秒NPU-SSD跳数", "date": "2026-09-24", "source_cn": "Pandaily", "source_en": "Pandaily", "sector": "数字互联", "title_en": "Huawei Debuts OceanStor M900 Context Memory Storage for PB-Scale KV Cache", "summary_en": "At HUAWEI CONNECT 2026, Huawei introduced the OceanStor M900 Context Memory Storage system designed for SuperPoDs. The system offers a PB-scale shared KV-cache pool and achieves approximately 60-microsecond latency for one-hop NPU-to-SSD access. It also supports up to 40 TB/s of aggregate cluster bandwidth.", "companies": ["Huawei"]}, {"id": "5c158b20c27f99e0", "url": "https://news.google.com/rss/articles/CBMicEFVX3lxTE9sUW5fb3lLdVUxNDRuT3RNbkxVQXhucWdNLURyYkMzSkE4N1pZNnZDWGdZRlhNYWNHcWFEcUxiTkFsR3M1MEJvU3RsbU9qSkMxa0R0VGZpek1PeE12dmRhdmVCemFINXl5UWl6d0R3cXA?oc=5", "title_cn": "长六改火箭成功发射遥感四十号04组卫星", "date": "2026-09-24", "source_cn": "中国航天", "source_en": "China Space", "sector": "航天", "title_en": "Long March 6A Successfully Launches Yaogan-40 Group 04 Satellites", "summary_en": "The Long March 6A (Kuaizhou) launch vehic ng practical AI tools internationally.", "companies": ["Baidu"]}, {"id": "0c2a5ca5c2423895", "url": "https://technode.com/2026/09/23/deepseek-dsec-agent-training-sandbox-infrastructure/", "title_cn": "", "date": "2026-09-23", "source_cn": "动点科技", "source_en": "TechNode", "sector": "人工智能", "title_en": "DeepSeek Details DSec Sandbox Infrastructure for Agent Training", "summary_en": "DeepSeek published an arXiv paper detailing DSec, a sandbox platform designed for large-scale agent training. The system unifies function-call, container, microVM, and full-VM sandboxes, coordinating their lifecycle with reinforcement learning workloads. DeepSeek founder Liang Wenfeng is listed among the 130-plus authors. A production-scale unit reportedly spans around 160 nodes.", "companies": ["DeepSeek"]}, {"id": "e2f9b68d59324cb5", "url": "https://technode.com/2026/09/23/apple-ios-27-2-china-motion-data-restriction/", "title_cn": "", "date": "2026-09-23", "source_cn": "动点科技", "source_en": "TechNode", "sector": "数字互联", "title_en": "Apple adds China-only motion data restriction in iOS 27.2 beta", "summary_en": "Apple introduced a \"Restrict Motion Data\" feature in the iOS 27.2 beta, appearing under Privacy & Security > Motion & Fitness. This setting allows users to block individual apps from accessing motion sensors like accelerometers and gyroscopes. The update aims to reduce apps' ability to trigger \"shake-to-open\" ad redirects, addressing a common complaint among Chinese users.", "companies": ["Apple"]}, {"id": "5bc480b1b19f5626", "url": "https://technode.com/2026/09/23/dji-insta360-handheld-smart-camera-shipments-q2-2026/", "title_cn": "大疆与影石占据2026年Q2全球手持智能相机发货量93%份额", "date": "2026-09-23", "source_cn": "动点科技", "source_en": "TechNode", "sector": "综合", "title_en": "DJI and Insta360 Take 93% of Global Handheld Smart-Camera Shipments in Q2", "summary_en": "In Q2 2026, global handheld smart-camera shipments rose 57% year-over-year to over 5.88 million units, generating approximately R const SECTORS = ["人工智能","半导体","数字互联","绿色科技","生物医药","航天","量子","政策","市场与交易","综合"];
let sector = "";

const $ = s => document.querySelector(s);
const list = $("#list"), qEl = $("#q"), coEl = $("#company"),
      srEl = $("#source"), dyEl = $("#days"), secEl = $("#sectors");

// 板块筛选条
secEl.innerHTML = `<button class="chip" data-s="" aria-pressed="true">全部板块</button>` +
  SECTORS.filter(s => ITEMS.some(i => i.sector === s))
         .map(s => `<button class="chip" data-s="${s}" aria-pressed="false">${s} <em style="opacity:.6;font-style:normal">${ITEMS.filter(i=>i.sector===s).length}</em></button>`)
         .join("") + `<span class="count" id="count"></span>`;
secEl.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  sector = b.dataset.s;
  secEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  render();
});

// 公司 / 信源下拉
const fill = (el, vals) => el.insertAdjacentHTML("beforeend",
  [...new Set(vals)].sort((a,b)=>a.localeCompare(b,"zh")).map(v=>`<option>${v}</option>`).join(""));
fill(coEl, ITEMS.flatMap(i => i.companies || []));
fill(srEl, ITEMS.map(i => i.source_cn));

[qEl, coEl, srEl, dyEl].forEach(el => el.addEventListener("input", render));

function render(){
  const q = qEl.value.trim().toLowerCase(), co = coEl.value, sr = srEl.value;
  const floor = new Date(Date.now() - dyEl.value * 864e5).toISOString().slice(0,10);

  const hits = ITEMS.filter(i =>
    (!sector || i.sector === sector) &&
    (!co || (i.companies || []).includes(co)) &&
    (!sr || i.source_cn === sr) &&
    i.date >= floor &&
    (!q || [i.title_en, i.title_cn, i.summary_en, (i.companies||[]).join(" ")]
             .join(" ").toLowerCase().includes(q))
  );

  $("#count").textContent = `${hits.length} 条 / ${ITEMS.length}`;
  list.innerHTML = hits.length ? hits.map(i => `
    <article>
      <h2><a href="${i.url}" target="_blank" rel="noopener">${esc(i.title_en)}</a></h2>
      ${i.title_cn ? `<p class="cn">${esc(i.title_cn)}</p>` : ""}
      <div class="tags">
        <span class="t">${i.sector}</span>
        <span class="t src">${esc(i.source_cn)}</span>
        <span>${i.date}</span>
        ${(i.companies||[]).map(c=>`<span>${esc(c)}</span>`).join(" · ")}
      </div>
      <p class="sum">${esc(i.summary_en)}</p>
    </article>`).join("")
    : `<div class="empty">没有匹配的条目 · No matching items</div>`;
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
render();
</script>
</div>
</body>
</html>
