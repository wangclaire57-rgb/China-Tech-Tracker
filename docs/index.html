const UPDATED = "2026-10-09T00:18:34Z";

const SECTORS = ["AI","Robotics","Semiconductors","Quantum",
                 "Digital Connectivity","Biotech","Green Tech","Space"];
const TYPES = ["Breakthrough","Product","Corporate","Capital","Policy","Geopolitics"];
const TYPE_CN = {Breakthrough:"新技术", Product:"新产品", Corporate:"公司动态",
                 Capital:"资本运作", Policy:"监管政策", Geopolitics:"国际关系"};

let sector = "", ntype = "";

const $ = s => document.querySelector(s);
const list=$("#list"), qEl=$("#q"), coEl=$("#company"), srEl=$("#source"), dyEl=$("#days");

// 停更自检
(function(){
  const age = (Date.now() - new Date(UPDATED)) / 36e5;
  if (age > 48) {
    const el = $("#stale");
    el.textContent = `⚠ Data has not updated for ${Math.floor(age/24)} days — the ingestion workflow may have stalled. Check GitHub Actions.`;
    el.style.display = "block";
  }
})();

function chips(host, values, labeller, current, onPick, cls){
  const el = $(host);
  el.innerHTML = `<button class="chip ${cls}" data-v="" aria-pressed="${current===""}">All</button>` +
    values.filter(v => ITEMS.some(i => i[cls==="ty"?"news_type":"sector"] === v))
          .map(v => {
            const n = ITEMS.filter(i => i[cls==="ty"?"news_type":"sector"] === v).length;
            return `<button class="chip ${cls}" data-v="${v}" aria-pressed="false">${labeller(v)} <em style="opacity:.55;font-style:normal">${n}</em></button>`;
          }).join("");
  el.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    onPick(b.dataset.v);
    el.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    render();
  });
}
chips("#sectors", SECTORS, v => v, "", v => sector = v, "se");
chips("#types",   TYPES,   v => `${v} ${TYPE_CN[v]||""}`, "", v => ntype = v, "ty");

const fill = (el, vals) => el.insertAdjacentHTML("beforeend",
  [...new Set(vals)].filter(Boolean).sort().map(v=>`<option>${esc(v)}</option>`).join(""));
fill(coEl, ITEMS.flatMap(i => i.companies || []));
fill(srEl, ITEMS.map(i => i.source_cn || i.source_en));   // 真实发布媒体

[qEl, coEl, srEl, dyEl].forEach(el => el.addEventListener("input", render));

function render(){
  const q = qEl.value.trim().toLowerCase(), co = coEl.value, sr = srEl.value;
  const floor = new Date(Date.now() - dyEl.value * 864e5).toISOString().slice(0,10);

  const hits = ITEMS.filter(i =>
    (!sector || i.sector === sector) &&
    (!ntype  || i.news_type === ntype) &&
    (!co || (i.companies || []).includes(co)) &&
    (!sr || i.source_cn === sr || i.source_en === sr) &&
    i.date >= floor &&
    (!q || [i.title_en, i.title_cn, i.summary_en, (i.companies||[]).join(" ")]
             .join(" ").toLowerCase().includes(q))
  );

  $("#count").textContent = `${hits.length} / ${ITEMS.length} items`;
  list.innerHTML = hits.length ? hits.map(i => `
    <article>
      <h2><a href="${i.url}" target="_blank" rel="noopener">${esc(i.title_en)}</a></h2>
      ${i.title_cn ? `<p class="cn">${esc(i.title_cn)}</p>` : ""}
      <div class="byline">
        <b class="${i.source_tier === 0 ? 't0' : ''}">${esc(i.source_cn || i.source_en || "—")}</b>
        ${i.source_en && i.source_en !== i.source_cn ? `<span> ${esc(i.source_en)}</span>` : ""}
        <span> · ${i.date}</span>
      </div>
      <div class="tags">
        <span class="t">${esc(i.sector)}</span>
        ${i.news_type ? `<span class="t ty">${esc(i.news_type)}</span>` : ""}
        ${(i.companies||[]).map(c=>`<span>${esc(c)}</span>`).join(" · ")}
      </div>
      <p class="sum">${esc(i.summary_en)}</p>
    </article>`).join("")
    : `<div class="empty">No matching items</div>`;
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
render();
</script>
